driver: mock  # rtk_gnss na docelowym sprzęcie
driver_args:
  uart_port: /dev/ttyAMA0
  baudrate: 115200
  mux_select_gpio: 17  # BCM (pin 11), 74HC4053 A/B/C select: 0=Rover (tylko konfiguracja), 1=Base (praca normalna)
  gga_interval_s: 300  # throttling GGA->NTRIP; testy = rower stoi w miejscu, zmniejszyc gdy w ruchu
  ntrip:
    host: ""
    port: 2101
    mountpoint: ""
    user: ""
    password: ""
