[project]
name = "rover"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "aiomqtt",
]

[project.optional-dependencies]
motion = ["python-can"]
sensors = ["python-can"]
navigation = ["pyserial"]
vision = ["opencv-python-headless", "numpy"]
actuators = ["python-can"]
planner = ["httpx", "websockets"]
all = ["rover[motion,sensors,navigation,vision,actuators,planner]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
